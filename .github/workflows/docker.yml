name: docker

# 手动触发；默认用上游最新 tag 作为镜像版本号
on:
  workflow_dispatch:
    inputs:
      version:
        description: '镜像版本标签（留空 = 取上游最新 tag）'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 确定版本号
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -e
          ver="$INPUT_VERSION"

          if [ -z "$ver" ]; then
            ver=$(git ls-remote --tags --refs https://github.com/netcccyun/wxredirect.git \
                  | awk -F/ '{print $NF}' \
                  | grep -E '^[0-9]+(\.[0-9]+)*$' \
                  | sort -V | tail -1)
          fi

          # 允许填 1.8 或 v1.8，统一成不带 v 的版本号，标签再加 v
          ver="${ver#v}"

          if [ -z "$ver" ]; then
            echo "取不到上游版本号，请在触发时手动填写" >&2
            exit 1
          fi

          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "镜像版本: v$ver"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/wxredirect
          tags: |
            type=raw,value=v${{ steps.ver.outputs.version }}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
