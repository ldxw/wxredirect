{extend name="admin/layout" /}
{block name="title"}首页设置{/block}
{block name="main"}
<div class="container" style="padding-top:70px;">
<div class="col-xs-12 col-sm-8 col-lg-6 center-block" style="float: none;">
<div class="panel panel-primary">
<div class="panel-heading"><h3 class="panel-title">首页设置</h3></div>
<div class="panel-body">
  <form onsubmit="return saveHome(this)" method="post" class="form" role="form">
    <div class="form-group">
      <label>访问站点根目录时默认进入：</label>

      <div class="radio" style="margin-top:10px;">
        <label>
          <input type="radio" name="default_page" value="index"
                 {if config('sys.default_page') !== 'admin'}checked{/if}/>
          站点首页
          <span style="color:#999;">（微信公众号多域名回调系统的首页）</span>
        </label>
      </div>

      <div class="radio">
        <label>
          <input type="radio" name="default_page" value="admin"
                 {if config('sys.default_page') === 'admin'}checked{/if}/>
          管理员登录页
          <span style="color:#999;">（打开域名直接跳转到 /admin，未登录时显示登录页）</span>
        </label>
      </div>

      <p class="help-block" style="margin-top:10px;">
        站点的功能地址（/connect/oauth2/authorize、/return、/wxserver 等）不受影响，只有访问 `/` 时按这里的设置跳转。
      </p>
    </div>

    <div class="form-group text-center">
      <input type="submit" name="submit" value="保存" class="btn btn-success btn-block"/>
    </div>
  </form>
</div>
</div>
</div>
<script src="/static/js/layer/layer.js"></script>
<script>
function saveHome(obj){
    var ii = layer.load(2, {shade:[0.1,'#fff']});
    $.ajax({
        type : 'POST',
        url : './home',
        data : $(obj).serialize(),
        dataType : 'json',
        success : function(data) {
            layer.close(ii);
            if(data.code == 0){
                layer.msg('保存成功', {icon: 1});
            }else{
                layer.alert(data.msg, {icon: 2});
            }
        },
        error:function(){
            layer.close(ii);
            layer.msg('服务器错误');
        }
    });
    return false;
}
</script>
{/block}
