{extend name="admin/layout" /}
{block name="title"}QQ 一键登录{/block}
{block name="main"}
<div class="container" style="padding-top:70px;">
<div class="col-xs-12 col-sm-8 col-lg-6 center-block" style="float: none;">
<div class="panel panel-primary">
<div class="panel-heading"><h3 class="panel-title">QQ 一键登录</h3></div>
<div class="panel-body">

  <div class="alert alert-warning" style="line-height:1.8;">
    <b>这个入口目前只用于 QQ 互联接入申请。</b><br/>
    启用后登录页会显示「QQ 一键登录」按钮，点进去可以完整走完 QQ 授权，方便审核验证；
    但不会真正登录后台，后台仍然只用账号密码登录。
  </div>

  <div class="alert alert-info" style="line-height:1.8;">
    需要在 <a href="https://connect.qq.com/" target="_blank" rel="noopener">QQ 互联</a> 申请「网站应用」，
    把 <b>AppID</b>、<b>AppKey</b> 填到下面；回调地址用下面这一串（QQ 互联的默认回调）。
  </div>

  <form onsubmit="return saveQQ(this)" method="post" class="form" role="form">
    <div class="form-group">
      <label>启用 QQ 一键登录（仅申请展示）：</label>
      <input type="checkbox" name="enable" value="1" {if config_get('qqlogin_enable')}checked{/if}/>
    </div>
    <div class="form-group">
      <label>AppID：</label>
      <input type="text" name="appid" value="{:config_get('qqlogin_appid')}" class="form-control" placeholder="QQ 互联应用的 APP ID"/>
    </div>
    <div class="form-group">
      <label>AppKey：</label>
      <input type="text" name="appkey" value="{:config_get('qqlogin_appkey')}" class="form-control" placeholder="QQ 互联应用的 APP Key"/>
    </div>
    <div class="form-group">
      <label>回调地址（填到 QQ 互联后台）：</label>
      <div class="input-group">
        <input type="text" id="callback" value="{$callback}" class="form-control" readonly onclick="this.select()"/>
        <span class="input-group-btn">
          <button class="btn btn-default" type="button" onclick="copyCallback()">复制</button>
        </span>
      </div>
    </div>
    <div class="form-group text-center">
      <input type="submit" name="submit" value="保存" class="btn btn-success btn-block"/>
    </div>
  </form>

</div>
</div>
</div>
<script src="/static/js/layer/layer.js"></script>
<script>
function saveQQ(obj){
    var ii = layer.load(2, {shade:[0.1,'#fff']});
    $.ajax({
        type : 'POST',
        url : './qqset',
        data : $(obj).serialize() + '&enable=' + ($(obj).find('input[name=enable]').is(':checked') ? 1 : 0),
        dataType : 'json',
        success : function(data) {
            layer.close(ii);
            if(data.code == 0){
                layer.msg('保存成功', {icon: 1});
                setTimeout(function(){ location.reload(); }, 800);
            }else{
                layer.alert(data.msg, {icon: 2})
            }
        },
        error:function(){
            layer.close(ii);
            layer.msg('服务器错误');
        }
    });
    return false;
}

function copyCallback(){
    var el = document.getElementById('callback');
    el.select();
    document.execCommand('copy');
    layer.msg('已复制', {icon: 1});
}
</script>
{/block}
